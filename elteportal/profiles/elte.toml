schema_version = 1
name = "ELTE"

[canvas]
enabled = true
base_url = "https://canvas.elte.hu/api/v1"

[neptun]
enabled = true
flow = "elte-portal"
portal_url = "https://neptun.elte.hu"
api_url = "https://hallgato1.neptun.elte.hu/api"
lcid = 1033
student_host_suffix = "neptun.elte.hu"

[neptun.endpoints]
authenticate = "Account/Authenticate"
refresh = "Account/GetNewTokens"
outer_login = "Account/OuterLogin"
environment = "General/EnvironmentData"
userinfo = "UserInfo"
trainings = "MyTrainings"
calendar_events = "Calendar/GetCalendarEvents"
calendar_trainings = "Calendar/GetStudentTrainings"
calendar_links = "Calendar/GetLinksForCalendarExport"
course_terms = "SubjectCourse/GetTerms"
courses = "SubjectCourse/GetSubjectCourseList"
averages = "Advancement/GetTermAveragesByTraining"
credits = "advancement/creditprogress"
curriculum_templates = "Advancement/GetStudentCurriculumTemplates"
completable_subjects = "Curriculum/GetCompletableCurriculumSubjects"
optional_summary = "Curriculum/GetOptionalSubjectsSummary"
semesters = "administration/semiannualregistration/semesters"
exam_terms = "ExamResults/GetTermsForGetExamResultsList"
exam_results = "ExamResults/GetExamResultsList"
exams_registered = "ExamRegisteredExams/GetRegisteredExamsList"
exams_available = "ExamRegistration/GetExamsList"
invoices = "Invoices/GetInvoicesForStudent"
collective_invoices = "FinancialDataDashboard/GetCollectiveInvoices"
to_pay = "FinancialItem/GetItemsToBePayed"
scholarships = "Scholarship/GetScholarshipPayments"
scholarship_terms = "Scholarship/GetScholarshipAvailablePaymentTerms"
dormitory = "Dormitory/GetDormitoryDashboardPeriodsData"
messages_mandatory = "Messages/Mandatories"
unread_count = "Message/GetUnreadedMessagesCount"
tasks = "Tasks/GetDashboardTasksData"
requests = "RequestForm/GetNumberOfRequestForms"
publications = "Publication/GetPublications"
queries = "Queries/GetQueriesListData"
fir = "FIR/GetStudentFIRData"
taken_terms = "TakenSubjects/Terms"
taken_subjects = "TakenSubjects/GetTakenSubjects"
registry_terms = "RegistrySheet/GetStudentTrainingTerms"
grades = "RegistrySheet/GetStudentTakenSubjectsByTerm"

[timetable]
enabled = true
url = "https://tanrend.elte.hu/tanrendnavigation.php"

[files]
wornox = "https://wornox.web.elte.hu/Materials/"
webprog = "http://webprogramozas.inf.elte.hu"

